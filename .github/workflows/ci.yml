name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; the release job below opts into write for itself.
permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build both browser targets
        run: node build.js --zip

      - name: Firefox compatibility lint
        run: npx web-ext lint --source-dir dist/firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip

  # Pushing a tag like v0.2.0 publishes a GitHub Release carrying both
  # store-ready zips. A tag with a suffix (v0.2.0-beta) becomes a pre-release.
  release:
    needs: build-and-lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          VERSION="$(node -p "require('./manifest/base.json').version")"
          if [ "$BASE" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION" >&2
            exit 1
          fi

      - name: Fetch the built zips
        uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: dist

      # So anyone installing an unpacked build can check the zip they got is
      # the zip this workflow produced.
      - name: Checksum the zips
        working-directory: dist
        run: sha256sum *.zip | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "CleanThis $GITHUB_REF_NAME" \
            --generate-notes $PRERELEASE
