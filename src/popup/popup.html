<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CleanThis</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="ct-header">
    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <h1>CleanThis</h1>
    <a id="settings-link" href="#" title="Settings">Settings</a>
  </header>

  <section id="pending" class="pending" hidden>
    <h2>Needs your attention</h2>
    <ul id="pending-list"></ul>
  </section>

  <div class="actions">
    <button id="scan-page" type="button">
      Scan this page
      <span class="btn-sub">Standard scan</span>
    </button>
    <button id="clean-file" type="button" class="secondary">
      Clean a file…
      <span class="btn-sub">opens in a tab</span>
    </button>
  </div>

  <div id="scan-result" class="result" hidden></div>

  <p id="quota" class="quota"></p>

  <script src="../lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
